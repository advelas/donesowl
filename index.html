<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de personaje</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1b22; --panel:#27242f; --line:#3a3644; --text:#ece8f2; --muted:#9b95a8;
  --danger:#e5604d;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",sans-serif}
body{padding:12px;display:flex;flex-direction:column;gap:10px}
header{display:flex;gap:12px;align-items:center}
#avatar{width:84px;height:84px;border-radius:14px;border:2px dashed var(--line);background:var(--panel) center/cover no-repeat;cursor:pointer;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;flex:none}
#avatar.has{border-style:solid}
#name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:600 22px/1.2 Georgia,"Times New Roman",serif;padding:4px 0}
#name:focus{outline:none;border-color:var(--text)}
.stat{background:var(--panel);border-radius:10px;padding:10px;border-left:5px solid var(--c)}
.stat.group-salud{background:#2b2229}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top b{font-weight:600}
.val{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{position:relative;height:16px;background:#14121a;border-radius:8px;overflow:hidden;margin:6px 0 8px}
.fill{height:100%;width:100%;background:var(--c);transition:width .25s}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.pen{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pen.on{background:var(--danger);color:#fff}
.row{display:flex;gap:6px;align-items:center}
.row input[type=number],.row input.amt{width:62px;background:#14121a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px}
button{background:var(--line);color:var(--text);border:0;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{filter:brightness(1.2)}
button:focus-visible,input:focus-visible{outline:2px solid #9ec5ff;outline-offset:1px}
.dmg{background:var(--danger);color:#fff}
.prot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;font-size:12px;color:var(--muted)}
.prot label{display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--text);font-weight:600}
.ok{padding:4px 10px;font-size:18px;line-height:1}
.sp{flex:1}
.cfg{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}
input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
footer{display:flex;gap:6px;flex-wrap:wrap}
footer button{flex:1}
#msg{color:var(--muted);font-size:12px;min-height:16px}
[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:var(--panel);color:var(--muted)}
.tabs button.on{background:var(--line);color:var(--text);font-weight:600}
.pc{display:flex;gap:10px;background:var(--panel);border-radius:10px;padding:10px}
.pc .th{width:56px;height:56px;border-radius:10px;background:#14121a center/cover no-repeat;flex:none}
.pc .info{flex:1;min-width:0}
.pc h3{margin:0 0 4px;font:600 16px Georgia,"Times New Roman",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:84px 1fr 56px;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:3px}
.mini .b{height:7px;background:#14121a;border-radius:4px;overflow:hidden}
.mini .b i{display:block;height:100%}
.mini span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px;text-align:center}
.react{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel);cursor:pointer;font-weight:600}
.react:has(input:checked){background:#4d4208;outline:2px solid #f2c94c}
.react input:disabled{cursor:not-allowed}
.qi{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.qi button{padding:4px 8px;font-size:12px}
.qn{width:22px;height:22px;border-radius:50%;background:#f2c94c;color:#2a2200;font:700 12px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;flex:none}
.qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi.done .qt{text-decoration:line-through;color:var(--muted)}
.qi.done .qn{background:var(--line);color:var(--muted)}
.pc.hot{background:#4d4208;outline:2px solid #f2c94c}
.rb{margin-left:6px;font:700 11px system-ui,sans-serif;padding:1px 7px;border-radius:99px;background:#f2c94c;color:#2a2200;vertical-align:middle}
.newround{background:#b8912a;color:#1d1700;font-weight:600;padding:9px}
@media (min-width:620px){ body{padding:14px 18px} }
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:620px){ .cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start} }
#sheet{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;background:var(--panel);border-radius:10px;padding:12px}
.sh h4{margin:0 0 4px;font:700 15px Georgia,"Times New Roman",serif;letter-spacing:.05em;text-transform:uppercase;color:#f08a3c}
.kv{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.kv input{width:48px;text-align:center;background:#14121a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 2px;font:600 13px system-ui,sans-serif}
.kv input::-webkit-inner-spin-button,.kv input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.kv input[type=number]{-moz-appearance:textfield;appearance:textfield}
.tr{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:620px){ .tr-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tr-box{display:flex;flex-direction:column;gap:3px;background:#14121a;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tr-box select,.tr-box input{width:100%;background:transparent;border:0;color:var(--text);font:600 13px system-ui,sans-serif;padding:2px 0;text-transform:none;letter-spacing:0}
.tr-box select option,.tr-box select optgroup{background:var(--panel);color:var(--text)}
.tr-auto{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.tr-auto label{display:flex;gap:5px;align-items:center;cursor:pointer}
.tr-btns{display:flex;gap:6px;flex-wrap:wrap}
.tr-btns button{flex:1;min-width:84px;font-size:12px;font-weight:600}
.tr-btns .go{background:#f08a3c;color:#1d1000;font-size:14px}
.tr-prev,.tr-last{font-size:11px;color:var(--muted);margin-top:6px;word-break:break-word}
.tr-last{color:var(--text)}
.tr-target{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--muted)}
.tr-target select{background:#14121a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.kv.pick{cursor:pointer;border-radius:6px;padding:2px 6px;margin:0 -6px;transition:background .12s}
.kv.pick:hover{background:var(--line)}
.kv.pick.sel{background:#f08a3c;color:#1d1000;font-weight:700}
.kv.pick.sel:hover{background:#f39a56}
.pickbox{cursor:pointer}
.pickbox:hover{border-color:#f08a3c}
.tr-box b{font:600 13px system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--text);min-height:19px;display:block}
.tr-box b.empty{color:var(--muted);font-weight:400}

/* ===== Tema "hoja de personaje" (papel, tinta y naranja) ===== */
:root{
  --bg:#f3f1ec; --panel:rgba(255,255,255,.78); --line:#161616; --text:#161616; --muted:#5a5a63;
  --danger:#d63a2a; --orange:#f26a21; --yellow:#ffd23f; --ink:#161616; --blue:#dbe5fb;
  --f-head:"Bangers","Impact","Arial Narrow",sans-serif;
  --f-label:"Oswald","Arial Narrow","Segoe UI",sans-serif;
  color-scheme: light;
}
html{min-height:100%;background:#f3f1ec url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20800%20520'%20preserveAspectRatio='xMidYMax%20slice'%3E%3Cdefs%3E%3Cfilter%20id='b'%3E%3CfeGaussianBlur%20stdDeviation='2.5'/%3E%3C/filter%3E%3C/defs%3E%3Cg%20filter='url(%23b)'%3E%3Cpath%20d='M-20%20420%20C120%20395%20230%20335%20305%20250%20C345%20205%20385%20150%20408%20118%20L432%20118%20C455%20150%20495%20205%20535%20250%20C610%20335%20720%20395%20820%20420%20L820%20540%20L-20%20540Z'%20fill='%23a9afb8'%20opacity='.85'/%3E%3Cpath%20d='M392%20136%20L408%20118%20L432%20118%20L448%20136%20L437%20150%20L424%20139%20L413%20152%20L402%20141Z'%20fill='%23fff'%20opacity='.95'/%3E%3Cpath%20d='M-20%20470%20C140%20430%20300%20455%20430%20432%20C570%20408%20700%20450%20820%20428%20L820%20540%20L-20%20540Z'%20fill='%238f959e'%20opacity='.5'/%3E%3Cellipse%20cx='400'%20cy='432'%20rx='430'%20ry='26'%20fill='%23fff'%20opacity='.6'/%3E%3C/g%3E%3C/svg%3E") center bottom/cover no-repeat}
body{background:transparent;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px}
.topbar .tabs{flex:1}
.logo{height:44px;width:auto;flex:none;display:block}
.sheet-title{font:400 20px var(--f-head);color:var(--orange);letter-spacing:.05em;text-shadow:1px 1px 0 rgba(0,0,0,.35);white-space:nowrap}
@media (max-width:619px){ .sheet-title{display:none} }
button{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;font:500 13px var(--f-label);letter-spacing:.04em;text-transform:uppercase}
button:hover{filter:none;background:var(--yellow)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2b6fff;outline-offset:1px}
.dmg{background:var(--danger);color:#fff}
.dmg:hover{background:#e0503f}
.ok{padding:2px 8px}
.tabs button{background:#fff;color:var(--ink);font-size:14px}
.tabs button.on{background:var(--orange);color:var(--ink);font-weight:600}
.tabs button:hover:not(.on){background:var(--yellow)}
#avatar{border:2px dashed var(--ink);background:#fff center/cover no-repeat;color:var(--muted)}
#avatar.has{border-style:solid}
#name{background:var(--blue);border:0;border-radius:6px;padding:6px 12px;color:var(--ink);font:500 22px var(--f-label);text-transform:uppercase;letter-spacing:.04em}
#name::placeholder{color:#7d89ad}
.react{background:#fff;border:2px solid var(--ink);font:500 14px var(--f-label);text-transform:uppercase;letter-spacing:.05em}
.react:has(input:checked){background:var(--yellow);outline:none}
.react input{accent-color:var(--orange);width:18px;height:18px}
#sheet{background:rgba(255,255,255,.7);backdrop-filter:blur(2px);border-radius:12px}
.sh h4{font:400 24px var(--f-head);color:var(--orange);letter-spacing:.05em;text-shadow:1px 1px 0 rgba(0,0,0,.35);margin:0 0 6px}
.kv{font:400 13px var(--f-label);letter-spacing:.06em;color:var(--ink)}
.kv input,.row input[type=number],.row input.amt{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;font:600 14px var(--f-label)}
.kv input{width:44px;padding:3px 0}
.row input[type=number],.row input.amt{padding:4px 6px}
.kv.pick:hover{background:#ffe3c4}
.kv.pick.sel{background:var(--orange);color:#1a0a00;font-weight:600}
.kv.pick.sel:hover{background:#f57d3d}
.stat{background:rgba(255,255,255,.8);border:2px solid var(--ink);border-left:8px solid var(--c);border-radius:10px}
.stat.group-salud{background:rgba(255,255,255,.8)}
.top b{font:500 15px var(--f-label);text-transform:uppercase;letter-spacing:.05em}
.val{color:var(--ink);font:600 14px var(--f-label)}
.bar{background:#e8e4db;border:2px solid var(--ink);height:18px}
.tick{background:var(--ink);width:2px}
.pen{background:#e8e4db;color:var(--ink);border:1px solid var(--ink);font:500 11px var(--f-label);text-transform:uppercase}
.pen.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.cfg,.prot{color:var(--muted);font-family:var(--f-label)}
.prot label{color:var(--ink)}
.prot input,.tr-auto input{accent-color:var(--orange)}
input[type=color]{border:2px solid var(--ink);border-radius:6px;width:28px;height:26px;background:#fff}
.tr{border-top:2px solid rgba(0,0,0,.25)}
.tr-box{background:#fff;border:2px solid var(--ink);font-family:var(--f-label);color:var(--muted)}
.tr-box input,.tr-box b{color:var(--ink);font-family:var(--f-label)}
.tr-box b.empty{color:#8a8a93}
.pickbox:hover{border-color:var(--orange);background:#fff7ef}
.tr-btns button{font-size:13px}
.tr-btns .go{background:var(--orange);color:var(--ink);font-size:16px;font-weight:600}
.tr-btns .go:hover{background:#f57d3d}
.tr-prev{color:var(--muted)}
.tr-last{color:var(--ink);font-weight:500}
.tr-target{color:var(--muted)}
.tr-target select{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px}
.pc{background:rgba(255,255,255,.85);border:2px solid var(--ink)}
.pc h3{font:500 17px var(--f-label);text-transform:uppercase;letter-spacing:.04em}
.pc .th{background:#e8e4db;border:2px solid var(--ink)}
.pc.hot{background:#fff1ad;outline:3px solid var(--yellow);outline-offset:0}
.mini{color:var(--ink);font-family:var(--f-label)}
.mini .b{background:#e8e4db;border:1px solid var(--ink)}
.empty{color:var(--muted)}
.rb{background:var(--yellow);color:var(--ink);border:1px solid var(--ink);font-family:var(--f-label);text-transform:uppercase}
.qi{border-top:1px solid rgba(0,0,0,.2)}
.qn{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.qi.done .qn{background:#e8e4db;color:var(--muted);border-color:var(--muted)}
.newround{background:var(--yellow);color:var(--ink);font-weight:600}
.newround:hover{background:#ffe27a}
#msg{color:var(--ink);font-weight:500}
.cols{grid-template-columns:minmax(0,1fr)}
@media (min-width:620px){ .cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)} }
#sheet{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px}
.sh h4{font-size:19px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-size:12px;letter-spacing:.04em;min-width:0}
.kv span{min-width:0}
.kv input{width:40px;flex:none}
.row input.amt{width:78px}
@media (min-width:620px){ .tr-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tr-box span{font-size:9px;line-height:1.15}
</style>
</head>
<body>
<div class="topbar"><img class="logo" src="logo.png" alt="DONES"><nav class="tabs"><button id="tabMine" class="on">Mi ficha</button><button id="tabParty">Party</button></nav><div class="sheet-title">Hoja de personaje</div></div>
<div id="mine" class="view">
<header>
  <div id="avatar" title="Subir imagen" tabindex="0" role="button">Subir imagen</div>
  <input id="name" placeholder="Nombre del personaje" maxlength="40" aria-label="Nombre del personaje">
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
</header>
<label class="react"><input type="checkbox" id="react"><span>Reacción</span></label>

<div class="cols">
  <div id="sheet"></div>
  <main id="stats" style="display:flex;flex-direction:column;gap:8px"></main>
</div>

<label class="cfg" style="font-size:13px"><input type="checkbox" id="share"> Compartir mi ficha con la party</label>
<footer>
  <button id="importSheet">Importar hoja (Excel o CSV)</button>
  <button id="reset">Reiniciar ficha</button>
  <input id="sheetfile" type="file" accept=".xlsx,.xlsm,.csv" hidden>
</footer>
</div>
<div id="party" class="view" hidden></div>
<div id="msg" aria-live="polite"></div>

<script type="module">
const DEFAULT = () => ({
  name: "",
  share: true,
  img: "",
  data: {},
  roll: { base:"", skill:"", bonus:"", pen:"", autoS:true, autoM:true, target:"everyone" },
  stats: {
    resFis:  { label:"Resistencia física",     kind:"res",   max:10, cur:10, color:"#d98a3d" },
    resEne:  { label:"Resistencia energética", kind:"res",   max:10, cur:10, color:"#4aa3df" },
    resMen:  { label:"Resistencia mental",     kind:"res",   max:10, cur:10, color:"#9b7bd6" },
    salud:   { label:"Salud",                  kind:"salud", max:10, cur:10, color:"#d9534f" },
    saludMen:{ label:"Salud mental",           kind:"salud", max:10, cur:10, color:"#c0508f" },
    hpExtra: { label:"HP Extra",               kind:"res",   max:0,  cur:0,  color:"#9aa0a6", unlimited:true, prot:["resFis"] },
  }
});

let state = DEFAULT();
let KEY = "ficha-personaje-v1";
const $ = s => document.querySelector(s);
const msg = t => { $("#msg").textContent = t; clearTimeout(msg.t); msg.t = setTimeout(()=>$("#msg").textContent="", 3500); };

/* ---------- Almacenamiento (navegador) ---------- */
function save(){
  share(); renderParty();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ msg("No se pudo guardar en el navegador (imagen muy pesada?)."); }
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) merge(JSON.parse(raw));
  } catch(e){}
}
function merge(data){
  const base = DEFAULT();
  base.name = String(data.name ?? "");
  base.img = typeof data.img === "string" ? data.img : "";
  base.share = data.share !== false;
  for (const [key] of ALL_FIELDS){
    const n = Number(data.data?.[key]);
    if (data.data?.[key] != null && data.data?.[key] !== "" && Number.isFinite(n)) base.data[key] = Math.round(n);
  }
  const rl = data.roll || {};
  if (BASES.some(b => b[0] === rl.base)) base.roll.base = rl.base;
  if (SKILLS.includes(rl.skill)) base.roll.skill = rl.skill;
  base.roll.bonus = typeof rl.bonus === "string" ? rl.bonus.slice(0, 20) : "";
  base.roll.pen = typeof rl.pen === "string" ? rl.pen.slice(0, 20) : "";
  base.roll.autoS = rl.autoS !== false;
  base.roll.autoM = rl.autoM !== false;
  if (TARGETS.some(t => t[0] === rl.target)) base.roll.target = rl.target;
  for (const k in base.stats){
    const s = data.stats?.[k];
    if (!s) continue;
    const cur = Number.isFinite(Number(s.cur)) ? Number(s.cur) : base.stats[k].cur;
    if (base.stats[k].unlimited){
      base.stats[k].cur = Math.max(0, Math.floor(cur));
      const pl = Array.isArray(s.prot) ? s.prot : (s.prot ? [s.prot] : base.stats[k].prot);
      base.stats[k].prot = pl.filter(x => ['resFis','resEne','resMen'].includes(x));
    }
    else {
      const max = Math.max(1, Number(s.max) || base.stats[k].max);
      base.stats[k].max = max;
      base.stats[k].cur = Math.min(max, Math.max(0, cur));
    }
    if (typeof s.color === "string") base.stats[k].color = s.color;
  }
  state = base;
}

/* ---------- Interfaz ---------- */
const refs = {};
function build(){
  buildSheet();
  const box = $("#stats"); box.innerHTML = "";
  for (const k in state.stats){
    const s = state.stats[k];
    const el = document.createElement("section");
    el.className = "stat group-" + s.kind;
    el.innerHTML = `
      <div class="top"><b>${s.label}</b><span class="pen" hidden></span><span class="val"></span></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="row">
        <input type="text" class="amt" inputmode="text" autocomplete="off" placeholder="-3 / +2" aria-label="Cambio: sin signo resta, con + suma">
        <button class="ok" aria-label="Aplicar cambio">☑️</button>
        <span class="sp"></span>
        <label class="cfg">Máx <input type="number" class="max" min="1" aria-label="Máximo de ${s.label}"></label>
        <input type="color" class="col" aria-label="Color de ${s.label}">
      </div>`;
    box.append(el);
    const r = refs[k] = {
      el, val:el.querySelector(".val"), fill:el.querySelector(".fill"), bar:el.querySelector(".bar"),
      pen:el.querySelector(".pen"), amt:el.querySelector(".amt"), max:el.querySelector(".max"), col:el.querySelector(".col")
    };
    if (s.unlimited){
      const pr = document.createElement("div"); pr.className = "prot";
      pr.title = "El daño a las resistencias marcadas se resta primero del HP Extra. FIS y ENE también protegen la Salud; MEN, la Salud mental.";
      pr.innerHTML = "<span>Protege:</span>" + [["resFis","FIS"],["resEne","ENE"],["resMen","MEN"]]
        .map(([v, t]) => `<label><input type="checkbox" value="${v}"> ${t}</label>`).join("");
      pr.onchange = () => { s.prot = [...pr.querySelectorAll('input:checked')].map(i => i.value); save(); };
      r.amt.placeholder = "+5"; r.amt.setAttribute("aria-label", "HP Extra a sumar");
      el.querySelector(".top").after(pr);
      r.prot = pr;
    }
    if (s.kind === "salud"){
      for (const f of [1/3, 2/3]){
        const t = document.createElement("i"); t.className = "tick"; t.style.left = (f*100)+"%"; r.bar.append(t);
      }
    }
    const apply = () => {
      if (!r.amt.value.trim()) return;
      const d = parseDelta(r.amt.value, s.unlimited ? "+" : "-");
      if (d === null){ msg("Usa números con + o -. Sin signo, resta. Ej.: 3, +2, -4+1"); return; }
      change(k, d); r.amt.value = "";
    };
    el.querySelector(".ok").onclick = apply;
    r.amt.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); apply(); } };
    r.max.onchange = () => {
      const nm = Math.max(1, Math.floor(Number(r.max.value) || 1));
      const delta = nm - s.max;
      s.max = nm; s.cur = Math.min(nm, Math.max(0, s.cur + delta));
      refresh(k); save();
    };
    r.col.oninput = () => { s.color = r.col.value; refresh(k); save(); };
  }
  refreshAll();
}

/* Penalizador de salud: -2 al perder un tercio, -5 al perder dos tercios (o más) */
function penalty(s){
  const thirds = Math.min(3, Math.floor((s.max - s.cur) / (s.max / 3) + 1e-9));
  return [0, 2, 5, 5][thirds];
}

/* Qué resistencias del HP Extra protegen a cada medidor */
const PROT = {
  resFis:["resFis"], resEne:["resEne"], resMen:["resMen"],
  salud:["resFis", "resEne"], saludMen:["resMen"]
};

/* "5" -> -5 | "+3" -> +3 | "-2" -> -2 | "+4-2" -> +2 | "5+3" -> -2 (el primer número sin signo resta) */
function parseDelta(str, def = "-"){
  let t = String(str).replace(/\s+/g, "");
  if (!/^[+-]?\d+([+-]\d+)*$/.test(t)) return null;
  if (!/^[+-]/.test(t)) t = def + t;
  return t.match(/[+-]\d+/g).reduce((a, x) => a + parseInt(x, 10), 0);
}

function change(k, d){
  const s = state.stats[k];
  if (s.unlimited){
    if (d < 0){ msg("El HP Extra solo se suma. Se gasta al recibir daño en la resistencia que protege."); return; }
    s.cur += d; refresh(k); save(); return;
  }
  if (d < 0){
    const hp = state.stats.hpExtra;
    if (hp && (PROT[k] || []).some(x => hp.prot.includes(x)) && hp.cur > 0){
      const absorbed = Math.min(hp.cur, -d);
      hp.cur -= absorbed; d += absorbed;
      refresh("hpExtra");
      msg(`HP Extra absorbió ${absorbed}` + (d < 0 ? `; ${-d} pasan a ${s.label}.` : "."));
    }
  }
  s.cur = Math.min(s.max, Math.max(0, s.cur + d));
  refresh(k); save();
}

function refresh(k){
  const s = state.stats[k], r = refs[k];
  r.el.style.setProperty("--c", s.color);
  if (r.prot) r.prot.querySelectorAll('input').forEach(i => { i.checked = s.prot.includes(i.value); });
  r.bar.hidden = !!s.unlimited;
  r.max.closest("label").hidden = !!s.unlimited;
  r.fill.style.width = s.unlimited ? "100%" : (s.cur / s.max * 100) + "%";
  r.val.textContent = s.unlimited ? String(s.cur) : `${s.cur} / ${s.max}`;
  if (!s.unlimited && document.activeElement !== r.max) r.max.value = s.max;
  r.col.value = s.color;
  if (s.kind === "salud"){
    const p = penalty(s);
    r.pen.hidden = false;
    r.pen.textContent = p ? `Penalizador -${p}` : "Sin penalizador";
    r.pen.classList.toggle("on", p > 0);
  }
  updateRoll();
}
function refreshAll(){
  for (const k in state.stats) refresh(k);
  $("#name").value = state.name;

const norm = t => String(t ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim();

let xlsxP = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxP ??= new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX);
    sc.onerror = () => { xlsxP = null; no(new Error("No se pudo cargar el lector de Excel.")); };
    document.head.append(sc);
  });
}

/* Lee la pestaña "Lista de cálculo": etiqueta en la columna A, valor en la B */
function parseSheet(XLSX, wb){
  const name = wb.SheetNames.find(n => norm(n).includes("LISTA")) ?? (wb.SheetNames.length === 1 ? wb.SheetNames[0] : null);
  if (!name) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
  const map = {};
  for (const r of rows){
    const k = norm(r[0]), v = Number(r[1]);
    if (k && r[1] !== null && r[1] !== "" && Number.isFinite(v)) map[k] = v;
  }
  return map;
}

function applySheet(map){
  let n = 0;
  for (const [key, , label] of ALL_FIELDS) if (label in map){ state.data[key] = Math.round(map[label]); n++; }
  for (const [label, k] of Object.entries(IMPORT_MAX)) if (label in map){
    const s = state.stats[k], nm = Math.max(1, Math.round(map[label]));
    s.cur = Math.min(nm, Math.max(0, s.cur + (nm - s.max))); // conserva el daño ya recibido
    s.max = nm; n++;
  }
  return n;
}

$("#importSheet").onclick = () => $("#sheetfile").click();
$("#sheetfile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  try {
    const XLSX = await loadXLSX();
    const csv = /\.csv$/i.test(f.name);
    const wb = csv ? XLSX.read(await f.text(), { type:"string" }) : XLSX.read(await f.arrayBuffer(), { type:"array" });
    const map = parseSheet(XLSX, wb);
    if (!map){ msg("No encontré la pestaña \"Lista de cálculo\"."); return; }
    const n = applySheet(map);
    if (!n){ msg("No reconocí ningún dato en las columnas A y B."); return; }
    build(); save(); msg(`Hoja importada: ${n} valores.`);
  } catch(err){ msg("No se pudo leer el archivo: " + err.message); }
};

/* 3d10dl1dh1 + base + habilidad + bonificadores - penalizadores */
function buildCommand(single){
  const R = state.roll, names = [], parts = [BASE_DICE];
  const add = key => {
    const v = state.data[key];
    if (v == null) throw new Error(`Falta el valor de ${LABEL[key]}.`);
    parts.push((v < 0 ? "-" : "+") + Math.abs(v)); names.push(LABEL[key]);
  };
  if (single) add(single);
  else {
    if (!R.base || !R.skill) throw new Error("Elige una característica o aptitud y una habilidad.");
    add(R.base); add(R.skill);
  }
  const b = R.bonus.trim() ? parseDelta(R.bonus, "+") : 0;
  if (b === null) throw new Error("Bonificadores no válidos. Ej.: 2 o 2+1");
  let pen = R.pen.trim() ? parseDelta(R.pen, "+") : 0;
  if (pen === null) throw new Error("Penalizadores no válidos. Ej.: 1 o 1+2");
  pen = Math.abs(pen);
  if (R.autoS) pen += penalty(state.stats.salud);
  if (R.autoM) pen += penalty(state.stats.saludMen);
  if (b) parts.push((b < 0 ? "-" : "+") + Math.abs(b));
  if (pen) parts.push("-" + pen);
  return parts.join("") + " #" + names.join(" y ");
}

function updateRoll(){

  q("autoS").checked = R.autoS; q("autoM").checked = R.autoM; q("target").value = R.target;
  const sp = penalty(state.stats.salud), mp = penalty(state.stats.saludMen);
  sec.querySelector('[data-l="s"]').textContent = "Salud: " + (sp ? "-" + sp : "sin penalizador");

  try { sec.querySelector(".tr-prev").textContent = "Comando: " + buildCommand(); }

function checkDicePlus(){
  const requestId = crypto.randomUUID();
  return new Promise(resolve => {
    const off = OBR.broadcast.onMessage("dice-plus/isReady", ev => {
      if (ev.data && "ready" in ev.data && ev.data.requestId === requestId){ off(); resolve(true); }
    });
    OBR.broadcast.sendMessage("dice-plus/isReady", { requestId, timestamp: Date.now() }, { destination:"ALL" });
    setTimeout(() => { off(); resolve(false); }, 1000);
  });
}

async function rollDice(single){
  if (!OBR){ msg("Las tiradas solo funcionan dentro de Owlbear Rodeo."); return; }
  let cmd;
  try { cmd = buildCommand(single); } catch(e){ msg(e.message); return; }
  if (!(await checkDicePlus())){ msg("No encuentro Dice+. Instálalo en la sala para poder tirar."); return; }
  const rollId = "roll_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  pendingRolls.add(rollId);
  document.querySelector("#sheet .tr-last").textContent = "Tirando… " + cmd;
  OBR.broadcast.sendMessage("dice-plus/roll-request", {
    rollId, playerId: selfId, playerName: await OBR.player.getName(),
    rollTarget: state.roll.target, diceNotation: cmd, showResults: true,
    timestamp: Date.now(), source: SRC
  }, { destination:"ALL" });
}

function registerDiceListeners(){
  OBR.broadcast.onMessage(`${SRC}/roll-result`, ev => {
    const d = ev.data;
    if (!d || !pendingRolls.has(d.rollId)) return;
    pendingRolls.delete(d.rollId);
    const el = document.querySelector("#sheet .tr-last");
    if (el) el.textContent = `Total ${d.result?.totalValue}: ${d.result?.rollSummary ?? ""}`;
  });
  OBR.broadcast.onMessage(`${SRC}/roll-error`, ev => {
    const d = ev.data;
    if (!d || !pendingRolls.has(d.rollId)) return;
    pendingRolls.delete(d.rollId);
    msg("Dice+ no pudo hacer la tirada: " + d.error);
  });
}

/* Miniatura de 64 px: la imagen completa pesa demasiado para los metadatos */
let thumb = "", thumbSrc = null;
function ensureThumb(cb){
  if (!state.img){ thumb = ""; thumbSrc = ""; return cb(); }

}

function queueHTML(){
  let h = `<section class="stat" style="--c:#f2c94c"><div class="top"><b>Cola de reacciones</b><span class="val">${queue.length}</span></div>`;
  if (!queue.length) h += '<div class="empty" style="padding:8px">Nadie ha reaccionado.</div>';
  queue.forEach((e, i) => {
    h += `<div class="qi${e.done ? " done" : ""}"><span class="qn">${i + 1}</span><span class="qt">${esc(e.name)}</span>`;
    if (isGM) h += `<button data-op="resolve" data-id="${esc(e.id)}">${e.done ? "Reabrir" : "Resolver"}</button><button data-op="return" data-id="${esc(e.id)}" title="Devolver la reacción al jugador">Devolver</button>`;
    else if (e.done) h += '<span class="val">resuelta</span>';
    h += "</div>";
  });
  return h + "</section>";
}

function renderParty(){
  const box = $("#party"); if (box.hidden) return;
  if (!OBR){ box.innerHTML = '<div class="empty">La party solo está disponible dentro de Owlbear Rodeo.</div>'; return; }
  let html = "";
  if (isGM) html += `<button data-reset class="newround">${roundArmed ? "¿Seguro? Toca otra vez para confirmar" : "Nueva ronda: limpiar cola y reacciones"}</button>`;
  html += queueHTML();
  if (!isGM){
    const own = {};
    for (const k in state.stats){ const s = state.stats[k]; own[k] = [s.cur, s.unlimited ? null : s.max, s.color, s.prot]; }
    html += cardHTML(state.name || "Mi personaje", state.img, own, " (tú)", reactionUsed());
  }
  let n = 0;
  [...players].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
    const d = p.metadata?.[META];
    const hot = inQ(p.id);
    if (d && d.on && d.s){
      n++;
      html += cardHTML(d.name || p.name, d.thumb, d.s, d.name ? ` <small style="color:var(--muted);font-weight:400">${esc(p.name)}</small>` : "", hot);
    } else if (p.role !== "GM"){
      n++;
      html += `<div class="pc${hot ? " hot" : ""}"><div class="info"><h3>${esc(p.name)}${hot ? '<span class="rb">Reacción</span>' : ""}</h3><div class="empty" style="padding:2px;text-align:left">No compartió su ficha.</div></div></div>`;
    }
  });
  if (isGM && !n) html += '<div class="empty">Aún no hay jugadores en la sala.</div>';
  box.innerHTML = html;
}

$("#party").onclick = e => {
  if (!OBR || !isGM) return;
  const b = e.target.closest("[data-reset],[data-op]"); if (!b) return;
  if (b.hasAttribute("data-reset")){
    if (!roundArmed){
      roundArmed = true; renderParty();
      setTimeout(() => { roundArmed = false; renderParty(); }, 4000);
      return;
    }
    roundArmed = false; send({ type:"reset" }); renderParty();
  } else send({ type:"op", op:b.dataset.op, id:b.dataset.id });
};

function tab(party){
  $("#mine").hidden = party; $("#party").hidden = !party;
  $("#tabMine").classList.toggle("on", !party); $("#tabParty").classList.toggle("on", party);
  renderParty();
}
$("#tabMine").onclick = () => tab(false);
$("#tabParty").onclick = () => tab(true);
$("#share").onchange = e => { state.share = e.target.checked; save(); };

/* Reacción: el jugador solo puede activarla; la devuelve el GM */
function updateReact(){
  const el = $("#react"), used = reactionUsed();
  el.checked = used; el.disabled = !OBR || used;
  const i = queue.findIndex(e => e.id === selfId);
  $("#react + span").textContent = !used ? "Reacción"
    : i >= 0 ? `Reacción usada (n.º ${i + 1}${queue[i].done ? ", resuelta" : ""})` : "Reacción usada";
}
$("#react").onchange = async e => {
  if (!OBR || reactionUsed() || !e.target.checked){ updateReact(); return; }
  sent = true; updateReact();
  clearTimeout(sentT);
  sentT = setTimeout(() => {
    if (!inQ(selfId)){ sent = false; updateReact(); msg("No se registró la reacción. ¿Hay un GM conectado?"); }
  }, 5000);
  const name = state.name.trim() || await OBR.player.getName();
  send({ type:"reaccion", id:selfId, name });
};

/* El GM solo ve la party: sin ficha propia y sin compartir nada */
function applyRole(role){
  isGM = role === "GM";
  document.querySelector(".tabs").hidden = isGM;
  if (isGM && OBR) OBR.player.setMetadata({ [META]: { on:false } });
  tab(isGM);
}

async function init(){
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm");
    const sdk = mod.default;
    await new Promise((ok, no) => { sdk.onReady(ok); setTimeout(no, 2500); });
    if (sdk.isAvailable){
      OBR = sdk;
      KEY = "ficha-personaje-v1:" + OBR.room.id;
      selfId = await OBR.player.getId();
      registerDiceListeners();
      players = await OBR.party.getPlayers();
      queue = normQ(await OBR.room.getMetadata());
      OBR.party.onChange(ps => { players = ps; renderParty(); });
      OBR.room.onMetadataChange(md => {
        queue = normQ(md);
        if (inQ(selfId)) sent = false;
        updateReact(); renderParty();
      });
      OBR.player.onChange(p => { if ((p.role === "GM") !== isGM) applyRole(p.role); });
      applyRole(await OBR.player.getRole());
    }
  } catch(e){ /* fuera de Owlbear: funciona igual, sin party */ }
  load(); build(); share(); updateReact(); renderParty();
}
init();
</script>
</body>
</html>
